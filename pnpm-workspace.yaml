allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': false
  better-sqlite3: false
  core-js: false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# 10 days to decrease the risk of supply chain attacks
minimumReleaseAge: 14400
minimumReleaseAgeExclude:
  - '@posthog/browser-common@0.4.0'
  - '@posthog/core@1.46.8'
  - '@posthog/types@1.402.1'
  - '@yume-chan/adb@2.6.2'
  - posthog-js@1.413.1
  # Patched versions needed to resolve security advisories before the 10-day window.
  - source-map-js@1.2.2
  - shell-quote@1.11.0

# Nuxt tooling still requests vulnerable versions; retain compatible patched releases.
overrides:
  '@simple-git/argv-parser@<2.0.1': ^2.0.1
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 14400
